<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ChromeOS PWA</title>
  <!-- Fixed: Added relative dot './' for GitHub Pages subfolders -->
  <link rel="manifest" href="./manifest.json">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f0f4f8;
    }
    #install-btn {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: none; 
    }
    #install-btn:hover { background-color: #1557b0; }
  </style>
</head>
<body>

  <h1>Welcome to My PWA</h1>
  <p>This is a minimal web page that can be installed on ChromeOS.</p>
  
  <button id="install-btn">Install App</button>

  <script>
    // Fixed: Added relative dot './' to register properly in the repository subfolder
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.error('Registration failed:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); 
      deferredPrompt = e;   
      installBtn.style.display = 'inline-block'; 
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt(); 
      const { outcome } = await deferredPrompt.userChoice;
      
      if (outcome === 'accepted') {
        console.log('User installed the app!');
      }
      
      deferredPrompt = null; 
      installBtn.style.display = 'none'; 
    });
  </script>
</body>
</html>
