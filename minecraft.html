<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft</title>

    <style>

        html,
        body {
            margin: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        #fullscreen-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;

            padding: 10px;

            cursor: pointer;
        }

    </style>

</head>

<body>

<button id="fullscreen-btn">
    Toggle Fullscreen
</button>

<iframe
    id="game"
    src="https://raw.githubusercontent.com/codet-code/Open-Testing/main/EaglercraftX_1.8_u53_Offline_Signed.html"
    title="Minecraft"
></iframe>

<script>

const button =
    document.getElementById("fullscreen-btn");

const game =
    document.getElementById("game");

button.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            await game.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.error(error);

    }

});

</script>

</body>
</html>
